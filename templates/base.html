<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tutors Platform{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Alpine.js for interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- PWA Meta -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tutors Platform">
    <link rel="apple-touch-icon" href="/static/images/icon-192x192.png">
    
    <!-- Custom styles -->
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Loading state */
        .htmx-request {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Line clamp utility */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* HTMX indicators */
        .htmx-indicator {
            display: none;
        }
        
        .htmx-request .htmx-indicator {
            display: inline;
        }
        
        .htmx-request.htmx-indicator {
            display: inline;
        }
        
        /* Smooth transitions */
        .transition-all {
            transition: all 0.3s ease;
        }
        
        /* Focus styles */
        .focus-ring:focus {
            outline: none;
            ring: 2px;
            ring-color: #3b82f6;
            ring-offset: 2px;
        }
        
        /* Custom button styles */
        .btn-primary {
            @apply bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium;
        }
        
        .btn-secondary {
            @apply bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition-colors font-medium;
        }
        
        .btn-danger {
            @apply bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors font-medium;
        }
        
        /* Card styles */
        .card {
            @apply bg-white rounded-lg shadow-md p-6;
        }
        
        .card-hover {
            @apply hover:shadow-lg transition-shadow;
        }
        
        /* Form styles */
        .form-input {
            @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors;
        }
        
        .form-label {
            @apply block text-sm font-medium text-gray-700 mb-2;
        }
        
        /* Status badges */
        .badge-success {
            @apply bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs;
        }
        
        .badge-warning {
            @apply bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs;
        }
        
        .badge-error {
            @apply bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs;
        }
        
        .badge-info {
            @apply bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-blue-600">
                        🎓 Tutors Platform
                    </a>
                </div>
                
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <div class="relative" x-data="{ open: false }">
                            <button @click="open = !open" class="flex items-center text-sm bg-white rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                <span class="sr-only">Open user menu</span>
                                <div class="h-8 w-8 bg-blue-500 rounded-full flex items-center justify-center text-white font-medium">
                                    {{ user.first_name.0|default:user.username.0|upper }}
                                </div>
                                <span class="ml-2 text-gray-700">{{ user.get_full_name|default:user.username }}</span>
                            </button>
                            
                            <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5">
                                <div class="py-1">
                                    <a href="/profile/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Профиль</a>
                                    <a href="/orders/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Мои заказы</a>
                                    {% if user.tutor_profile %}
                                        <a href="/tutor/dashboard/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Кабинет репетитора</a>
                                    {% endif %}
                                    <hr class="my-1">
                                    <a href="/logout/" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Выйти</a>
                                </div>
                            </div>
                        </div>
                    {% else %}
                        <a href="/login/" class="text-gray-700 hover:text-blue-600">Войти</a>
                        <a href="/register/" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Notifications -->
    <div id="notifications" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Modals container -->
    <div id="modals"></div>

    <!-- WebSocket connection for real-time updates -->
    {% if user.is_authenticated %}
    <script>
        // WebSocket connection for notifications
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/tutor/notifications/`;
        
        try {
            const socket = new WebSocket(wsUrl);
            
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                showNotification(data.message, data.type || 'info');
            };
            
            socket.onclose = function(event) {
                console.log('WebSocket closed:', event);
            };
            
            socket.onerror = function(error) {
                console.log('WebSocket error:', error);
            };
        } catch (error) {
            console.log('WebSocket connection failed:', error);
        }
    </script>
    {% endif %}

    <!-- Utility functions -->
    <script>
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show notification (XSS-safe)
        function showNotification(message, type = 'info') {
            const colors = {
                info: 'bg-blue-500',
                success: 'bg-green-500',
                warning: 'bg-yellow-500',
                error: 'bg-red-500'
            };

            const notification = document.createElement('div');
            notification.className = `${colors[type] || 'bg-blue-500'} text-white px-4 py-3 rounded-md shadow-lg fade-in`;

            // Create elements safely without innerHTML to prevent XSS
            const container = document.createElement('div');
            container.className = 'flex items-center justify-between';

            const messageSpan = document.createElement('span');
            messageSpan.textContent = message;  // Safe - uses textContent

            const closeButton = document.createElement('button');
            closeButton.className = 'ml-4 text-white hover:text-gray-200';
            closeButton.textContent = '✕';
            closeButton.onclick = () => notification.remove();

            container.appendChild(messageSpan);
            container.appendChild(closeButton);
            notification.appendChild(container);

            document.getElementById('notifications').appendChild(notification);

            // Auto remove after 5 seconds
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.remove();
                }
            }, 5000);
        }
        
        // Confirm dialog (XSS-safe)
        function confirmAction(message, callback) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';

            const modalContent = document.createElement('div');
            modalContent.className = 'bg-white rounded-lg p-6 max-w-md mx-4';

            const title = document.createElement('h3');
            title.className = 'text-lg font-semibold text-gray-900 mb-4';
            title.textContent = 'Подтверждение';

            const messagePara = document.createElement('p');
            messagePara.className = 'text-gray-600 mb-6';
            messagePara.textContent = message;  // Safe - uses textContent

            const buttonContainer = document.createElement('div');
            buttonContainer.className = 'flex justify-end space-x-3';

            const cancelButton = document.createElement('button');
            cancelButton.className = 'btn-secondary';
            cancelButton.textContent = 'Отмена';
            cancelButton.onclick = () => modal.remove();

            const confirmButton = document.createElement('button');
            confirmButton.className = 'btn-danger';
            confirmButton.textContent = 'Подтвердить';
            confirmButton.onclick = () => {
                modal.remove();
                if (typeof callback === 'function') {
                    callback();
                }
            };

            buttonContainer.appendChild(cancelButton);
            buttonContainer.appendChild(confirmButton);
            modalContent.appendChild(title);
            modalContent.appendChild(messagePara);
            modalContent.appendChild(buttonContainer);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
        }
        
        // Format currency
        function formatCurrency(amount, currency = 'RUB') {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: currency
            }).format(amount);
        }
        
        // Format date
        function formatDate(date, options = {}) {
            const defaultOptions = {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            return new Intl.DateTimeFormat('ru-RU', { ...defaultOptions, ...options }).format(new Date(date));
        }
        
        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // Throttle function
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }
        
        // Copy to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Скопировано в буфер обмена', 'success');
            }).catch(() => {
                showNotification('Не удалось скопировать', 'error');
            });
        }
        
        // Local storage utilities
        const storage = {
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    console.error('Error saving to localStorage:', e);
                }
            },
            get: (key, defaultValue = null) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    console.error('Error reading from localStorage:', e);
                    return defaultValue;
                }
            },
            remove: (key) => {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    console.error('Error removing from localStorage:', e);
                }
            }
        };
        
        // HTMX event handlers
        document.addEventListener('htmx:responseError', function(event) {
            showNotification('Произошла ошибка. Попробуйте еще раз.', 'error');
        });
        
        document.addEventListener('htmx:afterRequest', function(event) {
            if (event.detail.successful) {
                // Handle successful requests
                const trigger = event.detail.elt;
                if (trigger.dataset.successMessage) {
                    showNotification(trigger.dataset.successMessage, 'success');
                }
            }
        });
        
        // Global error handler
        window.addEventListener('error', function(event) {
            console.error('Global error:', event.error);
            // You could send this to your error tracking service
        });
        
        // Page visibility API
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Page is hidden
                console.log('Page hidden');
            } else {
                // Page is visible
                console.log('Page visible');
            }
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            // Ctrl/Cmd + K for search
            if ((event.ctrlKey || event.metaKey) && event.key === 'k') {
                event.preventDefault();
                const searchInput = document.querySelector('input[type="search"], input[placeholder*="поиск"]');
                if (searchInput) {
                    searchInput.focus();
                }
            }
            
            // Escape to close modals
            if (event.key === 'Escape') {
                const modals = document.querySelectorAll('.fixed');
                modals.forEach(modal => {
                    if (modal.style.display !== 'none') {
                        modal.remove();
                    }
                });
            }
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    showNotification('Доступно обновление! Перезагрузите страницу.', 'info');
                                    
                                    // Add update button
                                    const updateBtn = document.createElement('button');
                                    updateBtn.className = 'fixed bottom-4 left-4 bg-blue-600 text-white px-4 py-2 rounded-md shadow-lg z-50';
                                    updateBtn.textContent = 'Обновить';
                                    updateBtn.onclick = () => window.location.reload();
                                    document.body.appendChild(updateBtn);
                                }
                            });
                        });
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        // PWA install prompt
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Show install button
            const installBtn = document.createElement('button');
            installBtn.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-md shadow-lg z-50';
            installBtn.innerHTML = '📱 Установить приложение';
            installBtn.onclick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    deferredPrompt = null;
                    installBtn.remove();
                }
            };
            document.body.appendChild(installBtn);
            
            // Auto-hide after 10 seconds
            setTimeout(() => {
                if (installBtn.parentElement) {
                    installBtn.remove();
                }
            }, 10000);
        });
        
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            showNotification('Приложение установлено!', 'success');
        });
    </script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
